<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sección composición · vista previa</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fcfcfc;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}

  /* ---- Sección composición (Figma 231:2183) ---- */
  .composition{
    background:#f3f4f1;
    padding:120px 80px;
    display:flex;
    justify-content:center;
  }
  /* Escenario a proporción exacta del diseño (1281x750). Escala manteniendo posiciones. */
  .composition__stage{
    position:relative;
    width:1281px;max-width:100%;
    aspect-ratio:1281/750;
    display:flex;gap:1.56%;align-items:flex-start;
  }

  /* Fondo verde (630x750) */
  .composition__green{
    width:49.18%;height:100%;flex-shrink:0;
    background:#535d3c;
  }

  /* Columna derecha (631) */
  .composition__col{
    width:49.26%;height:100%;flex-shrink:0;
    display:flex;flex-direction:column;gap:3.6%;
  }

  /* Ficha producto (631x361): foto de fondo + tarjeta navegador abajo */
  .composition__ficha{position:relative;width:100%;height:48.13%;overflow:hidden}
  .composition__ficha-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .composition__ficha-card{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:81.6%;height:89.5%;
    border-radius:11px 11px 0 0;overflow:hidden;z-index:1;background:#fff;
  }
  .composition__ficha-card img{position:absolute;left:0;top:-8.25%;width:100%;height:113.27%;object-fit:cover}

  /* Vídeo recolección olivas (631x362) — mismo tamaño que en Figma */
  .composition__video{position:relative;width:100%;height:48.27%;overflow:hidden;background:#000}
  .composition__video video{width:100%;height:100%;object-fit:cover;display:block}

  /* Mockup de móvil (321x662) superpuesto sobre el verde */
  .composition__phone{
    position:absolute;left:12.02%;top:7.6%;
    width:25.06%;height:88.27%;overflow:hidden;
  }
  .composition__phone img{position:absolute;left:-144.32%;top:-13.97%;width:388.64%;height:125.82%;max-width:none}

  /* En móvil se apila para que no quede diminuto */
  @media (max-width:820px){
    .composition{padding:64px 24px}
    .composition__stage{flex-direction:column;aspect-ratio:auto;gap:20px}
    .composition__green{display:none}
    .composition__col{width:100%;gap:20px}
    .composition__ficha{height:auto;aspect-ratio:631/361}
    .composition__video{height:auto;aspect-ratio:631/362}
    .composition__phone{
      position:static;width:70%;max-width:320px;height:auto;aspect-ratio:321/662;
      margin:0 auto;order:-1;
    }
  }
</style>
</head>
<body>

<section class="composition">
  <div class="composition__stage">
    <!-- Fondo verde -->
    <div class="composition__green"></div>

    <!-- Columna derecha -->
    <div class="composition__col">
      <div class="composition__ficha">
        <img class="composition__ficha-bg" src="assets/priordei/ficha-producto.png" alt="">
        <div class="composition__ficha-card">
          <img src="assets/priordei/captura-ficha.png" alt="Ficha de producto Priordei — Llegat">
        </div>
      </div>
      <div class="composition__video">
        <video src="assets/priordei/recoleccion-olivas.mp4"
               poster="assets/priordei/foto-recolecta-poster.png"
               autoplay muted loop playsinline
               aria-label="Recolección de olivas"></video>
      </div>
    </div>

    <!-- Mockup de móvil superpuesto -->
    <div class="composition__phone">
      <img src="assets/priordei/montaje-mobile.png" alt="Priordei — versión móvil">
    </div>
  </div>
</section>

</body>
</html>
